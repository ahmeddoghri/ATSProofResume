name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      OPENAI_API_KEY: sk-test-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Run tests
        run: pytest -q

  audit-engine:
    # The audit half must work with nothing but python-docx installed: no
    # OpenAI, no Selenium, no web server, no API key.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install only the audit dependency
        run: pip install python-docx
      - name: Score a resume offline
        run: |
          python -m ats.cli fixtures /tmp/corpus
          python -m ats.cli score /tmp/corpus/clean.docx --min-score 90
          python -m ats.cli score /tmp/corpus/header_contact.docx -j /tmp/corpus/job_posting.txt
          python -m ats.cli compare /tmp/corpus/header_contact.docx /tmp/corpus/clean.docx

  benchmark:
    # The committed benchmark.json must match what the detector produces.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install only the audit dependency
        run: pip install python-docx
      - name: Regenerate and diff the benchmark artifact
        run: |
          python -m ats.bench --json /tmp/benchmark.json
          diff -u benchmark.json /tmp/benchmark.json
